<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#11161b">
<title>ラベル照合</title>
<style>
  :root{
    --bg:#11161b; --panel:#1a222a; --panel2:#222d37; --line:#2e3b47;
    --text:#e9eef3; --dim:#8a99a7; --amber:#ffc300; --ng:#ff4c3b; --ok:#2ed07a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
    font-size:16px; line-height:1.55;
    -webkit-user-select:none; user-select:none;
  }
  .wrap{padding:12px 12px calc(16px + env(safe-area-inset-bottom)); max-width:640px; margin:0 auto;}
  h1{font-size:19px; font-weight:800; margin:2px 0 12px; letter-spacing:.02em;}
  .sub{color:var(--dim); font-size:12px;}
  button{
    min-height:52px; padding:0 16px; border-radius:6px; font-size:16px; font-weight:700;
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    font-family:inherit;
  }
  button.on{background:var(--amber); color:#191307; border-color:#d6a300;}
  button.wide{width:100%;}
  button.sm{min-height:42px; font-size:14px; font-weight:600; padding:0 12px;}
  button.quiet{background:transparent; color:var(--dim);}
  button:disabled{opacity:.4;}
  select{
    width:100%; min-height:54px; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:6px; padding:0 12px; font-size:17px;
    font-family:inherit;
  }
  input[type=number]{
    width:100%; min-height:54px; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:6px; padding:0 12px; font-size:17px;
    font-family:inherit;
  }
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:10px;}
  .lbl{display:block; font-size:12px; color:var(--dim); margin-bottom:6px;}
  .row{display:flex; gap:8px;}
  .row>*{flex:1;}
  .hidden{display:none !important;}
  .banner{border-radius:8px; padding:12px; margin-bottom:10px; font-size:14px;}
  .banner.err{border:1px solid var(--ng); color:var(--ng);}
  .banner.info{border:1px solid var(--amber); color:var(--amber);}

  /* 対象商品の表示 */
  .target{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:10px;}
  .target .nm{font-size:18px; font-weight:700; margin-bottom:10px; line-height:1.35;}
  .kv{display:flex; align-items:baseline; gap:10px; margin-top:6px;}
  .kv .k{font-size:12px; color:var(--dim); width:84px; flex:none;}
  .kv .v{font-size:26px; font-weight:800; letter-spacing:.06em; font-variant-numeric:tabular-nums;}
  .kv .v.small{font-size:20px; letter-spacing:.02em;}

  /* カメラ */
  .cam{position:relative; background:#000; border-radius:10px; overflow:hidden; margin-bottom:10px;}
  .cam video{width:100%; display:block; max-height:56vh; object-fit:contain; background:#000;}
  .reticle{
    position:absolute; left:4%; right:4%; top:8%; bottom:8%;
    border:2px solid rgba(255,195,0,.7); border-radius:6px; pointer-events:none;
  }
  /* 読み取り時の静止画と、期限の並べ比べ */
  .shot{width:100%; border-radius:8px; display:block; background:#000;}
  .cmp{display:flex; gap:10px; margin-top:10px;}
  .cmp>div{
    flex:1; background:var(--panel2); border:1px solid var(--line);
    border-radius:8px; padding:10px; text-align:center;
  }
  .cmp .k{font-size:11px; color:var(--dim);}
  .cmp .d{font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:2px;}
  .zoomwrap{overflow:hidden; border-radius:8px; background:#000;}
  .flash{position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .12s;}
  .flash.ok{background:rgba(46,208,122,.5); opacity:1;}
  .flash.ng{background:rgba(255,76,59,.55); opacity:1;}

  /* 判定 */
  .verdict{border-radius:10px; padding:16px; margin-bottom:10px; border:2px solid var(--line);}
  .verdict .big{font-size:34px; font-weight:800; line-height:1.1;}
  .verdict .msg{font-size:14px; color:var(--dim); margin-top:6px;}
  .verdict.ok{border-color:var(--ok);} .verdict.ok .big{color:var(--ok);}
  .verdict.ng{border-color:var(--ng);} .verdict.ng .big{color:var(--ng);}

  /* カウンタ */
  .counts{display:flex; gap:8px; margin-bottom:10px;}
  .cnt{flex:1; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; text-align:center;}
  .cnt .n{font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1;}
  .cnt .t{font-size:11px; color:var(--dim);}
  .cnt.ng .n{color:var(--ng);}
  .cnt.ok .n{color:var(--ok);}

  .log{max-height:200px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .log div{font-size:13px; padding:6px 0; border-bottom:1px solid var(--line); display:flex; gap:10px;}
  .log .t{color:var(--dim); font-variant-numeric:tabular-nums; flex:none;}
  .log .r.ok{color:var(--ok);} .log .r.ng{color:var(--ng);}
  .note{font-size:12px; color:var(--dim); line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">

  <h1>ラベル照合 <span class="sub" id="verTag"></span></h1>

  <div id="banner" class="banner err hidden"></div>
  <div id="engine" class="banner info" style="font-size:12px;">読み取り機能を準備中…</div>

  <!-- ========== 対象選択 ========== -->
  <section id="pane-select">
    <div class="card">
      <label class="lbl">製造日</label>
      <select id="selDate"></select>
    </div>
    <div class="card">
      <label class="lbl">商品</label>
      <select id="selItem"></select>
    </div>
    <div id="targetBox"></div>
    <div class="row" style="margin-bottom:10px;">
      <button class="on" id="btnMode1">① ラベル確認</button>
      <button id="btnMode2">② 流しで確認</button>
    </div>
    <p class="note">
      ① はピック前に1枚かざして、その日の商品のラベルで合っているかを確認します。<br>
      ② は加熱前のバットに沿ってカメラをスライドさせ、バーコードが読めない個体（印字切れ）を音で知らせます。
    </p>
    <div class="card">
      <button class="sm quiet wide" id="btnReload">製造データを読み直す</button>
    </div>
  </section>

  <!-- ========== ① ラベル確認 ========== -->
  <section id="pane-one" class="hidden">
    <div id="oneTarget"></div>
    <div class="cam">
      <video id="v1" playsinline muted></video>
      <div class="reticle"></div>
      <div class="flash" id="f1"></div>
    </div>
    <div id="oneVerdict" class="verdict hidden">
      <div class="big" id="oneBig"></div>
      <div class="msg" id="oneMsg"></div>
    </div>
    <div class="card hidden" id="shotCard">
      <label class="lbl">読み取った瞬間の画像（賞味期限を見比べてください）</label>
      <div class="zoomwrap"><img id="shotImg" class="shot" alt=""></div>
      <div id="cmpBox"></div>
      <div id="kigenVerdict" class="verdict hidden" style="margin-top:10px; padding:12px;">
        <div class="big" id="kigenBig" style="font-size:24px;"></div>
        <div class="msg" id="kigenMsg"></div>
      </div>
      <div class="row" style="margin-top:10px;">
        <button class="sm on" id="btnKigenOk">目視で一致を確認</button>
        <button class="sm" id="btnKigenNg">期限がちがう</button>
      </div>
    </div>
    <div class="card">
      <div id="scanState" style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
        <span id="scanDot" style="width:12px; height:12px; border-radius:50%; background:var(--amber); flex:none;"></span>
        <span id="scanTxt" style="font-size:15px; font-weight:600;">読み取り中…</span>
      </div>
      <p class="note" id="oneHint">バーコードを枠の中に入れてください。読み取ると自動で照合します。</p>
    </div>
    <div class="card">
      <label class="lbl">動作状況（うまくいかないときはこの内容を伝えてください）</label>
      <div class="dbgbox" style="font-size:12px; color:var(--dim); font-family:ui-monospace,monospace; white-space:pre-wrap; line-height:1.6;">—</div>
    </div>

    <div class="row" style="margin-bottom:10px;">
      <button class="sm" id="btnOneRetry">もう一度読む</button>
      <button class="sm" id="btnTorch">ライト点灯</button>
      <button class="sm quiet" id="btnOneBack">対象選択へ戻る</button>
    </div>
    <div class="card">
      <button class="sm wide" id="btnPhoto">写真から読む</button>
      <p class="note" style="margin-top:8px;">
        保存済みの写真ファイルを直接解析します。パソコンやスマホの画面に映したバーコードをカメラで撮っても、
        画面の反射とギザつきでほぼ読めません。検証するときはこちらを使ってください。
      </p>
      <img id="photoPrev" class="hidden" style="width:100%; max-width:320px; border-radius:6px; margin-top:10px;" alt="">
    </div>
    <input type="file" id="photoFile" accept="image/*" style="display:none">
  </section>

  <!-- ========== ② 流しで確認 ========== -->
  <section id="pane-run" class="hidden">
    <div id="runTarget"></div>
    <div class="counts">
      <div class="cnt ok"><div class="n" id="cOk">0</div><div class="t">OK</div></div>
      <div class="cnt ng"><div class="n" id="cNg">0</div><div class="t">要確認</div></div>
      <div class="cnt"><div class="n" id="cSet">—</div><div class="t">並べた数</div></div>
    </div>
    <div class="cam">
      <video id="v2" playsinline muted></video>
      <div class="reticle"></div>
      <div class="flash" id="f2"></div>
    </div>
    <div id="runState" style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
      <span id="runDot" style="width:12px; height:12px; border-radius:50%; background:var(--amber); flex:none;"></span>
      <span id="runTxt" style="font-size:14px; color:var(--dim);">カメラ準備中…</span>
    </div>
    <div id="runVerdict" class="verdict hidden">
      <div class="big" id="runBig"></div>
      <div class="msg" id="runMsg"></div>
    </div>
    <div class="row" style="margin-bottom:10px;">
      <button class="sm" id="btnUndo">1つ戻す</button>
      <button class="sm" id="btnSetCount">並べた数を入力</button>
    </div>
    <div class="row" style="margin-bottom:10px;">
      <button class="sm on" id="btnFinish">照合して終了</button>
      <button class="sm quiet" id="btnRunBack">対象選択へ戻る</button>
    </div>
    <div class="card">
      <label class="lbl">動作状況（うまくいかないときはこの内容を伝えてください）</label>
      <div class="dbgbox" style="font-size:12px; color:var(--dim); font-family:ui-monospace,monospace; white-space:pre-wrap; line-height:1.6;">—</div>
    </div>
    <div class="card">
      <label class="lbl">読み取り履歴</label>
      <div class="log" id="runLog"></div>
    </div>
    <div class="card">
      <label class="lbl">印字切れの判定（現場に合わせて調整）</label>
      <div class="row">
        <button class="sm" id="btnSensDown">ゆるく</button>
        <button class="sm" id="btnSensUp">厳しく</button>
      </div>
      <p class="note" id="sensNote"></p>
    </div>
  </section>

</div>

<script>
/* =======================================================================
   設定：GAS のウェブアプリ URL をここに貼る
   ======================================================================= */
var API_URL = 'https://script.google.com/macros/s/AKfycby3pGZLfWWUOWFDMdEYoDZbhZuOIHOgOE5NlRs5QWp-mjM5-kCQLvtzc9X7UpraNw8b/exec';

var VERSION = 'v2.6';
document.getElementById('verTag').textContent = VERSION;

/* ================= 状態 ================= */
var ITEMS = [];          // 製造データ全件
var TARGET = null;       // 選択中の商品
var MODE = null;         // 'one' | 'run'
var reader = null;       // ZXing
var stream = null;
var scanning = false;

var okCount = 0, ngCount = 0, setCount = null;
var logRows = [];
var lastCode = '', lastHitAt = 0, lastMissAt = 0;
var GAP_MS = 700;        // 同一個体とみなす間隔
var missWindow = 1400;   // ラベルは見えるのに読めない時間（印字切れ判定）
var presentSince = 0;    // ラベルらしきものが視野に入った時刻
var warnedAt = 0;

/* ================= 小物 ================= */
function $(id){ return document.getElementById(id); }
function show(id, on){ $(id).classList.toggle('hidden', !on); }
function banner(msg, kind){
  var b = $('banner');
  if(!msg){ b.classList.add('hidden'); return; }
  b.className = 'banner ' + (kind || 'err');
  b.textContent = msg;
  b.classList.remove('hidden');
}
function fmtDate(s){
  if(!s) return '—';
  var p = s.split('-');
  return p[0] + '/' + Number(p[1]) + '/' + Number(p[2]);
}
function nowHM(){
  var d = new Date();
  return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2) + ':' + ('0'+d.getSeconds()).slice(-2);
}

/* ---- 音（iPhoneはバイブが使えないので音を主にする） ---- */
var actx = null;
function beep(kind){
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    var seq = kind === 'ok' ? [[880,.08]]
            : kind === 'ng' ? [[300,.16],[240,.22]]
            : [[520,.06]];
        var t = actx.currentTime;
    for(var i=0;i<seq.length;i++){
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square';
      o.frequency.value = seq[i][0];
      g.gain.value = .0001;
      o.connect(g); g.connect(actx.destination);
      o.start(t);
      g.gain.exponentialRampToValueAtTime(.28, t + .01);
      g.gain.exponentialRampToValueAtTime(.0001, t + seq[i][1]);
      o.stop(t + seq[i][1] + .02);
      t += seq[i][1] + .04;
    }
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(kind === 'ng' ? [90,60,90] : 40); }catch(e){}
}
function flash(id, kind){
  var el = $(id);
  el.className = 'flash ' + kind;
  setTimeout(function(){ el.className = 'flash'; }, 220);
}

/* ---- JAN13 の検証 ----
   商品はすべて13桁のJANのため、13桁以外は誤読として扱う。
   （8桁として読むと、13桁の一部を切り取って別の数字になることがある） */
function janValid(code){
  if(!/^\d{13}$/.test(code)) return false;
  var s = 0;
  for(var i=0;i<12;i++) s += Number(code[i]) * (i % 2 ? 3 : 1);
  return (10 - (s % 10)) % 10 === Number(code[12]);
}

/* ================= データ読み込み（JSONP） ================= */
function fetchItems(){
  return new Promise(function(res, rej){
    if(!API_URL || API_URL.indexOf('http') !== 0){
      rej(new Error('API_URL が設定されていません。index.html の API_URL に GAS の URL を貼ってください。'));
      return;
    }
    var cb = 'cb_' + Date.now();
    var s = document.createElement('script');
    var done = false;
    window[cb] = function(data){
      done = true;
      delete window[cb];
      s.remove();
      if(data && data.ok) res(data.items || []);
      else rej(new Error(data && data.message || 'データを取得できませんでした。'));
    };
    s.onerror = function(){
      if(done) return;
      s.remove();
      rej(new Error('通信に失敗しました。GASのデプロイ設定（アクセスできるユーザー＝全員）を確認してください。'));
    };
    s.src = API_URL + (API_URL.indexOf('?') < 0 ? '?' : '&') + 'callback=' + cb + '&t=' + Date.now();
    document.body.appendChild(s);
    setTimeout(function(){
      if(!done){ try{ s.remove(); }catch(e){} rej(new Error('応答がありません。通信環境を確認してください。')); }
    }, 15000);
  });
}

function loadData(){
  banner('製造データを読み込み中…', 'info');
  return fetchItems().then(function(items){
    ITEMS = items;
    try{ localStorage.setItem('items_cache', JSON.stringify(items)); }catch(e){}
    banner('');
    buildDateOptions();
  }).catch(function(e){
    var cached = null;
    try{ cached = JSON.parse(localStorage.getItem('items_cache') || 'null'); }catch(_){}
    if(cached && cached.length){
      ITEMS = cached;
      banner('最新データを取得できないため、前回読み込んだデータで表示しています。 / ' + e.message, 'info');
      buildDateOptions();
    } else {
      banner(e.message);
    }
  });
}

function buildDateOptions(){
  var dates = [];
  for(var i=0;i<ITEMS.length;i++){
    if(dates.indexOf(ITEMS[i].date) < 0) dates.push(ITEMS[i].date);
  }
  dates.sort();
  var today = new Date();
  var td = today.getFullYear() + '-' + ('0'+(today.getMonth()+1)).slice(-2) + '-' + ('0'+today.getDate()).slice(-2);
  var html = '';
  for(var j=0;j<dates.length;j++){
    html += '<option value="' + dates[j] + '"' + (dates[j] === td ? ' selected' : '') + '>'
          + fmtDate(dates[j]) + (dates[j] === td ? '（本日）' : '') + '</option>';
  }
  $('selDate').innerHTML = html || '<option value="">データがありません</option>';
  if(dates.indexOf(td) < 0 && dates.length){
    banner('本日（' + fmtDate(td) + '）の製造データがありません。日付を選び直すか、シートに貼り付けてください。', 'info');
  }
  buildItemOptions();
}

function buildItemOptions(){
  var d = $('selDate').value;
  var list = ITEMS.filter(function(x){ return x.date === d; });
  // 同一商品・同一JANの行は1件にまとめる（原本は同じ内容が複数行に分かれる）
  var seen = {}, uniq = [];
  for(var i=0;i<list.length;i++){
    var k = list[i].name + '|' + list[i].jan5 + '|' + list[i].frozen + '|' + list[i].chilled;
    if(seen[k]) { seen[k].shiji += list[i].shiji; continue; }
    var copy = JSON.parse(JSON.stringify(list[i]));
    seen[k] = copy;
    uniq.push(copy);
  }
  var html = '';
  for(var j=0;j<uniq.length;j++){
    html += '<option value="' + j + '">' + uniq[j].name + '（' + uniq[j].jan5 + '）</option>';
  }
  $('selItem').innerHTML = html || '<option value="">この日の商品がありません</option>';
  $('selItem').dataset.list = JSON.stringify(uniq);
  pickItem();
}

function pickItem(){
  var list = [];
  try{ list = JSON.parse($('selItem').dataset.list || '[]'); }catch(e){}
  TARGET = list[Number($('selItem').value)] || null;
  $('targetBox').innerHTML = TARGET ? targetHTML(TARGET) : '';
  var can = !!(TARGET && TARGET.jan5) && !!ENGINE;
  $('btnMode1').disabled = !can;
  $('btnMode2').disabled = !can;
  if(TARGET && !TARGET.jan5){
    banner('この商品はJANコード下5桁が空欄です。シートを確認してください。', 'info');
  }
}

function targetHTML(t){
  var h = '<div class="target"><div class="nm">' + esc(t.name) + '</div>'
        + '<div class="kv"><span class="k">JAN下5桁</span><span class="v">' + esc(t.jan5 || '—') + '</span></div>';
  if(t.chilled){
    h += '<div class="kv"><span class="k">賞味期限 冷蔵</span><span class="v">' + esc(isYmd(t.chilled) ? fmtDate(t.chilled) : t.chilled) + '</span></div>';
  }
  if(t.frozen){
    h += '<div class="kv"><span class="k">賞味期限 冷凍</span><span class="v'
       + (t.chilled ? ' small' : '') + '">' + esc(isYmd(t.frozen) ? fmtDate(t.frozen) : t.frozen) + '</span></div>';
  }
  if(!t.chilled && !t.frozen){
    h += '<div class="kv"><span class="k">賞味期限</span><span class="v">—</span></div>';
  }
  if(t.note) h += '<div class="kv"><span class="k">注意事項</span><span class="v small">' + esc(t.note) + '</span></div>';
  if(t.shiji) h += '<div class="kv"><span class="k">製造指示数</span><span class="v small">' + t.shiji + ' P</span></div>';
  h += '</div>';
  return h;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
  });
}

/* ================= カメラ ================= */
function startCamera(videoId){
  var v = $(videoId);
  // 賞味期限の細かい文字を読むため、取れるだけ高い解像度で開く。
  // 対応していない端末では自動的に下の設定に落ちる。
  var tries = [
    { facingMode:{ ideal:'environment' }, width:{ ideal:3840 }, height:{ ideal:2160 }, focusMode:'continuous' },
    { facingMode:{ ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1080 }, focusMode:'continuous' },
    { facingMode:{ ideal:'environment' } }
  ];
  var i = 0;
  function attempt(){
    return navigator.mediaDevices.getUserMedia({ video: tries[i++], audio:false })
      .catch(function(e){
        if(i < tries.length) return attempt();
        throw e;
      });
  }
  return attempt().then(function(st){
    stream = st;
    v.srcObject = st;
    v.setAttribute('playsinline', '');
    return v.play();
  });
}
function stopCamera(){
  scanning = false;
  stopNativeScan();
  stopScanTimer();
  stopScanWatch();
  stopFrameRing();
  torchOn = false; videoTrack = null;
  try{ if(reader) reader.reset(); }catch(e){}
  if(stream){
    stream.getTracks().forEach(function(t){ t.stop(); });
    stream = null;
  }
}


/* ================= 読み取りエンジンの準備 =================
   ZXing の配信元を順に試す。どれか1つ読めれば動く。
   iPhone 以外では標準の BarcodeDetector があればそちらを優先する。      */
var ENGINE = '';          // 'native' | 'zxing' | ''
var ZX_SOURCES = [
  'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js',
  'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/zxing-library/0.21.3/umd/index.min.js'
];

function setEngineMsg(txt, kind){
  var el = $('engine');
  el.className = 'banner ' + (kind || 'info');
  el.style.fontSize = '12px';
  el.textContent = txt;
}

function loadScript(src){
  return new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = src;
    s.onload = function(){ res(src); };
    s.onerror = function(){ s.remove(); rej(new Error(src)); };
    setTimeout(function(){ if(!window.ZXing) rej(new Error('timeout ' + src)); }, 12000);
    document.head.appendChild(s);
  });
}

function loadZXing(){
  var i = 0;
  function next(){
    if(window.ZXing) return Promise.resolve('loaded');
    if(i >= ZX_SOURCES.length) return Promise.reject(new Error('all failed'));
    return loadScript(ZX_SOURCES[i++]).then(function(){
      return window.ZXing ? 'loaded' : next();
    }).catch(next);
  }
  return next();
}

function prepareEngine(){
  // 標準機能が使えるか（Android Chrome など）
  if(window.BarcodeDetector){
    return BarcodeDetector.getSupportedFormats().then(function(fmts){
      if(fmts.indexOf('ean_13') >= 0){
        ENGINE = 'native';
        setEngineMsg('読み取り：端末の標準機能を使用', 'info');
        return;
      }
      return loadZXing().then(function(){
        ENGINE = 'zxing';
        setEngineMsg('読み取り：ZXing を使用', 'info');
      });
    }).catch(function(){
      return loadZXing().then(function(){
        ENGINE = 'zxing';
        setEngineMsg('読み取り：ZXing を使用', 'info');
      });
    });
  }
  return loadZXing().then(function(){
    ENGINE = 'zxing';
    setEngineMsg('読み取り：ZXing を使用', 'info');
  });
}

/* ---- 標準機能用の連続読み取り ---- */
var nativeDet = null, nativeTimer = null;
function startNativeScan(videoId, onHit, onMiss){
  if(!nativeDet) nativeDet = new BarcodeDetector({ formats: ['ean_13'] });
  var v = $(videoId);
  var busy = false;
  nativeTimer = setInterval(function(){
    if(!scanning || busy || !v.videoWidth) return;
    busy = true;
    nativeDet.detect(v).then(function(codes){
      busy = false;
      if(codes && codes.length) onHit(codes[0].rawValue);
      else if(onMiss) onMiss();
    }).catch(function(){ busy = false; if(onMiss) onMiss(); });
  }, 150);
}
function stopNativeScan(){
  if(nativeTimer){ clearInterval(nativeTimer); nativeTimer = null; }
}

/* ---- モードに応じて読み取りを開始する共通入口 ---- */

/* ================= canvas から1枚デコードする =================
   ZXing の低レベルAPIを直接使う。この経路は動作確認済み。
   （BrowserMultiFormatReader には canvas を直接渡す関数が無い） */
var coreReader = null, coreHints = null;
var LAST_POINTS = null;      // 直近に読めたバーコードの座標
var BARCODE_BOX = null;      // 元映像でのバーコード位置

function buildCoreReader(){
  try{
    coreHints = new Map();
    coreHints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.EAN_13
    ]);
    coreHints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    coreReader = new ZXing.MultiFormatReader();
    DECODE_MODE = 'core';
    return true;
  }catch(e){
    DIAG.lastErr = 'デコーダ生成失敗 ' + e.message;
    coreReader = null;
    return false;
  }
}

var DECODE_MODE = '';

function decodeCanvasSync(cv){
  if(!window.ZXing) return '';
  if(!coreReader && !buildCoreReader()) return '';
  try{
    var lum = new ZXing.HTMLCanvasElementLuminanceSource(cv);
    var bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum));
    var res = coreReader.decode(bmp, coreHints);
    if(res){
      try{ LAST_POINTS = res.getResultPoints() || null; }catch(e0){ LAST_POINTS = null; }
      return res.getText();
    }
    return '';
  }catch(e){
    var m = String(e && e.message || '');
    // 「見つからない／チェック不一致」は今は写っていないだけなので記録しない
    var normal = m.indexOf('able to detect') >= 0
              || m.indexOf('Checksum') >= 0
              || m.indexOf('Format') >= 0
              || m === '';
    if(!normal) DIAG.lastErr = m;
    return '';
  }finally{
    try{ coreReader.reset(); }catch(e2){}
  }
}

var scanTimer = null;
var scanCv = document.createElement('canvas');

function startScan(videoId, onHit, onMiss){
  if(ENGINE === 'native'){
    startNativeScan(videoId, onHit, onMiss);
    return;
  }
  // ZXing に毎回こちらから画像を渡す方式。
  // ライブラリ任せの自動ループが動かない端末があるため、自前で回す。
  if(!buildCoreReader()){ dbg(); return; }

  var v = $(videoId);
  var busy = false;
  scanTimer = setInterval(function(){
    if(!scanning || busy || !v.videoWidth) return;
    busy = true;
    DIAG.tries++;
    try{
      // 中央の帯（ガイド枠のあたり）だけを切り出して渡す。背景を除くと精度が上がる。
      var sw = v.videoWidth, sh = v.videoHeight;
      var cx = sw * 0.04, cy = sh * 0.20, cw = sw * 0.92, chh = sh * 0.60;
      var scale = Math.min(1, 1000 / cw);
      scanCv.width = Math.round(cw * scale);
      scanCv.height = Math.round(chh * scale);
      var ctx = scanCv.getContext('2d');
      ctx.drawImage(v, cx, cy, cw, chh, 0, 0, scanCv.width, scanCv.height);

      var result = decodeCanvasSync(scanCv);
      busy = false;
      if(result){
        DIAG.hits++;
        // 切り出し枠の中での位置を、元映像の座標に直して覚えておく
        if(LAST_POINTS && LAST_POINTS.length){
          var ys = [], xs = [];
          for(var q=0;q<LAST_POINTS.length;q++){
            xs.push(cx + LAST_POINTS[q].getX() / scale);
            ys.push(cy + LAST_POINTS[q].getY() / scale);
          }
          BARCODE_BOX = {
            x0: Math.min.apply(null, xs), x1: Math.max.apply(null, xs),
            y0: Math.min.apply(null, ys), y1: Math.max.apply(null, ys),
            vw: sw, vh: sh
          };
        }
        if(scanning) onHit(result);
      } else if(onMiss){
        onMiss();
      }
    }catch(e){
      busy = false;
      DIAG.lastErr = e.message;
    }
  }, 200);
}

function stopScanTimer(){
  if(scanTimer){ clearInterval(scanTimer); scanTimer = null; }
}

function makeReader(){
  var hints = new Map();
  var fmts = [
    ZXing.BarcodeFormat.EAN_13
  ];
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, fmts);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  return new ZXing.BrowserMultiFormatReader(hints, { delayBetweenScanAttempts: 80 });
}

/* ラベルらしき明るい面が枠内にあるか（印字切れ判定の前提） */
var probe = document.createElement('canvas');
function labelPresent(video){
  try{
    var vw = video.videoWidth, vh = video.videoHeight;
    if(!vw) return false;
    var w = 64, h = 40;
    probe.width = w; probe.height = h;
    var ctx = probe.getContext('2d');
    ctx.drawImage(video, vw*0.08, vh*0.28, vw*0.84, vh*0.44, 0, 0, w, h);
    var d = ctx.getImageData(0,0,w,h).data;
    var sum = 0, n = w*h, vals = new Array(n);
    for(var i=0,j=0;j<n;i+=4,j++){
      var g = (d[i]*299 + d[i+1]*587 + d[i+2]*114)/1000;
      vals[j] = g; sum += g;
    }
    var mean = sum/n, varsum = 0;
    for(var k=0;k<n;k++){ var t = vals[k]-mean; varsum += t*t; }
    var sd = Math.sqrt(varsum/n);
    // 明るい面（ラベル）があり、かつ模様（印字）があるとき
    return mean > 90 && sd > 18;
  }catch(e){ return false; }
}


/* ================= 賞味期限の読み取り（OCR） =================
   Tesseract を使い、数字と区切り記号だけに絞って読む。
   読めたら製造データと自動照合、読めなければ目視に回す（素通りさせない）。 */
var TESS_SOURCES = [
  'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
  'https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js'
];
var tessWorker = null, tessLoading = null;

function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  var i = 0;
  function next(){
    if(window.Tesseract) return Promise.resolve();
    if(i >= TESS_SOURCES.length) return Promise.reject(new Error('OCRを読み込めません'));
    return loadScript(TESS_SOURCES[i++]).then(function(){
      return window.Tesseract ? Promise.resolve() : next();
    }).catch(next);
  }
  return next();
}

function getTessWorker(){
  if(tessWorker) return Promise.resolve(tessWorker);
  if(tessLoading) return tessLoading;
  tessLoading = loadTesseract().then(function(){
    return Tesseract.createWorker('eng');
  }).then(function(w){
    tessWorker = w;
    return w;
  });
  return tessLoading;
}

/* 期待する日付を、印字されうる数字の並びに展開する */
function expectedDigitForms(ymd){
  if(!ymd) return { full: [], ym: [] };
  var p = ymd.split('-');
  var Y = p[0], M = p[1], D = p[2];
  var y2 = Y.slice(2);
  var m1 = String(Number(M)), d1 = String(Number(D));
  var full = [
    Y + M + D,        // 20280309
    y2 + M + D,       // 280309
    Y + m1 + d1,      // 202839
    y2 + m1 + d1      // 2839
  ];
  var ym = [ Y + M, y2 + M, Y + m1 ];
  return {
    full: full.filter(function(x){ return x.length >= 6; }),
    ym:   ym.filter(function(x){ return x.length >= 6; })
  };
}

/* 区切り記号を挟んだ表記（例 28.3.9 / 2028年3月9日）を元の文から探す */
function looseDateHit(rawText, ymd){
  if(!ymd) return false;
  var p = ymd.split('-');
  var Y = p[0], y2 = Y.slice(2);
  var m = String(Number(p[1])), d = String(Number(p[2]));
  var mm = p[1], dd = p[2];
  // 年は4桁でも2桁でも、月日は0埋めありでもなしでも可。間の記号は2文字まで許容。
  var re = new RegExp('(?:' + Y + '|' + y2 + ')[^0-9]{0,3}0?' + m + '[^0-9]{0,3}0?' + d + '(?![0-9])');
  var t = String(rawText || '').replace(/\s+/g, '');
  if(re.test(t)) return true;
  var re2 = new RegExp('(?:' + Y + '|' + y2 + ')[^0-9]{0,3}' + mm + '[^0-9]{0,3}' + dd + '(?![0-9])');
  return re2.test(t);
}

/* OCR結果から日付らしい部分を取り出して照合する */
function matchDate(rawText, ymd){
  var digits = String(rawText || '').replace(/[^0-9]/g, '');
  var f = expectedDigitForms(ymd);
  for(var i=0;i<f.full.length;i++){
    if(digits.indexOf(f.full[i]) >= 0) return { level:'full', hit:f.full[i], digits:digits };
  }
  if(looseDateHit(rawText, ymd)) return { level:'full', hit:'loose', digits:digits };
  // 完全な日付らしい並び（20xx + 4桁）が読めているのに一致しないなら、年月だけの一致で
  // 済ませず「不一致」とする。日付違いを見逃さないため。
  var full8 = digits.match(/20\d{6}/g);
  if(full8 && full8.length){
    return { level:'none', hit:full8[0], digits:digits };
  }
  for(var j=0;j<f.ym.length;j++){
    if(digits.indexOf(f.ym[j]) >= 0) return { level:'ym', hit:f.ym[j], digits:digits };
  }
  return { level:'none', hit:'', digits:digits };
}

/* 画像を読みやすく整える（拡大・グレー化・コントラスト強調） */
function prepForOcr(dataURL){
  return new Promise(function(res){
    var im = new Image();
    im.onload = function(){
      var scale = Math.min(3, Math.max(1.5, 1600 / im.naturalWidth));
      var cv = document.createElement('canvas');
      cv.width = Math.round(im.naturalWidth * scale);
      cv.height = Math.round(im.naturalHeight * scale);
      var ctx = cv.getContext('2d');
      ctx.drawImage(im, 0, 0, cv.width, cv.height);
      try{
        var d = ctx.getImageData(0,0,cv.width,cv.height);
        var a = d.data;
        for(var i=0;i<a.length;i+=4){
          var g = (a[i]*299 + a[i+1]*587 + a[i+2]*114)/1000;
          g = (g - 128) * 1.6 + 128;          // コントラストを上げる
          g = g < 0 ? 0 : (g > 255 ? 255 : g);
          a[i] = a[i+1] = a[i+2] = g;
        }
        ctx.putImageData(d, 0, 0);
      }catch(e){}
      res(cv.toDataURL('image/png'));
    };
    im.onerror = function(){ res(dataURL); };
    im.src = dataURL;
  });
}


/* 期待値が yyyy-MM-dd 形式の日付かどうか */
function isYmd(v){
  return /^\d{4}-\d{2}-\d{2}$/.test(String(v || ''));
}

/* コード表記（BG0908 など）がラベル上にあるか。
   OCRは英字を読み違えやすいので、英字部分はゆるく、数字部分は厳密に見る。 */
function codeHit(rawText, code){
  var c = String(code || '').toUpperCase().replace(/\s+/g, '');
  if(!c) return false;
  var t = String(rawText || '').toUpperCase().replace(/\s+/g, '');
  if(t.indexOf(c) >= 0) return true;                    // そのまま一致

  // 英字+数字に分けて、数字の並びが揃っていれば一致とみなす
  var m = c.match(/^([A-Z]*)(\d+)$/);
  if(!m) return false;
  var letters = m[1], nums = m[2];
  var digits = t.replace(/[^0-9]/g, '');
  if(digits.indexOf(nums) < 0) return false;            // 数字が無ければ不一致

  if(!letters) return true;
  // 数字の直前に英字が来ているかを、記号や誤認を挟んでも拾えるように確認
  var re = new RegExp('[A-Z0-9]{0,' + (letters.length + 1) + '}' + nums);
  return re.test(t);
}

/* 製造データに入っている賞味期限をすべて集める（冷凍・冷蔵の列を問わない） */
function wantedDates(){
  var out = [];
  if(!TARGET) return out;
  if(TARGET.frozen)  out.push({ label:'冷凍', ymd:TARGET.frozen });
  if(TARGET.chilled) out.push({ label:'冷蔵', ymd:TARGET.chilled });
  return out;
}

/* 比較表示を組み立てる */
function renderCmp(results){

    $('cmpBox').innerHTML = '<p class="note" style="margin:0">製造データに賞味期限が入っていません。</p>';
    return;
  }
  var h = '<div class="cmp">';
  for(var i=0;i<w.length;i++){

    h += '<div>'
      +   '<div class="k">' + w[i].label + '</div>'
      +   '<div class="d">' + esc(isYmd(w[i].ymd) ? fmtDate(w[i].ymd) : w[i].ymd) + '</div>'
      +   '<div style="font-size:12px; margin-top:4px; color:' + st.color + '">' + st.mark + '</div>'
      + '</div>';
  }

function setKigen(kind, big, msg){

/* 数字だけ／英数字だけ、と読むたびに文字種を指定する */
function recognizeWith(worker, img, mode){
  var white = (mode === 'code')
    ? '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'
    : '0123456789';
  return worker.setParameters({
    tessedit_char_whitelist: white,
    tessedit_pageseg_mode: '6',
    preserve_interword_spaces: '1'
  }).then(function(){
    return worker.recognize(img);
  });
}

/* バーコードの位置を手がかりに、日付がありそうな範囲を数パターン切り出す */
function cropCandidates(dataURL){
  return new Promise(function(res){
    var im = new Image();
    im.onload = function(){
      var W = im.naturalWidth, H = im.naturalHeight;
      var bands = [];
      // バーコードの上側を、細い帯に分けて順に読む。
      // 帯を狭くするほど余計な数字（内容量・栄養成分など）が混ざらず精度が上がる。
      var bTop = (BARCODE_BOX && BARCODE_BOX.vh)
        ? BARCODE_BOX.y0 * (H / BARCODE_BOX.vh)
        : H * 0.87;
      if(bTop < H * 0.2) bTop = H * 0.87;          // 位置が取れないときの保険
      var hh0 = bTop * 0.15;
      var offs = [0.28, 0.18, 0.38, 0.48, 0.08];    // 日付が来やすい順
      for(var bi=0; bi<offs.length; bi++){
        bands.push({ y: bTop * offs[bi], h: hh0, tag: '帯' + (bi+1) });
      }
      bands.push({ y: 0, h: bTop, tag:'全体' });
      var outs = [];
      for(var i=0;i<bands.length;i++){
        var b = bands[i];
        var y = Math.max(0, Math.round(b.y));
        var hh = Math.min(H - y, Math.round(b.h));
        if(hh < 40) continue;
        var scale = Math.min(4, Math.max(2, 2000 / W));
        var cv = document.createElement('canvas');
        cv.width = Math.round(W * scale);
        cv.height = Math.round(hh * scale);
        var ctx = cv.getContext('2d');
        ctx.drawImage(im, 0, y, W, hh, 0, 0, cv.width, cv.height);
        try{
          var d = ctx.getImageData(0,0,cv.width,cv.height), a = d.data;
          for(var k=0;k<a.length;k+=4){
            var g = (a[k]*299 + a[k+1]*587 + a[k+2]*114)/1000;
            g = (g - 128) * 1.7 + 128;
            a[k] = a[k+1] = a[k+2] = g < 0 ? 0 : (g > 255 ? 255 : g);
          }
          ctx.putImageData(d, 0, 0);
        }catch(e){}
        outs.push({ url: cv.toDataURL('image/png'), tag: b.tag });
      }
      res(outs);
    };
    im.onerror = function(){ res([]); };
    im.src = dataURL;
  });
}

function runDateOcr(dataURL, shots){
  var want = wantedDates();
  if(!want.length){
    renderCmp(null);
    setKigen('', '期限データなし', '製造データに賞味期限が入っていません。');
    return;
  }
  renderCmp(null);
  setKigen('', '賞味期限を読み取り中…', '初回はOCRの準備に時間がかかります（30秒〜1分）。');

  var needCode = false;
  for(var n=0;n<want.length;n++){ if(!isYmd(want[n].ymd)) needCode = true; }

  var allText = '';
  var sources = (shots && shots.length) ? shots : [dataURL];
  // 鮮明な順に複数枚、それぞれを帯に分けて読む。どれかで日付が拾えればよい。
  Promise.all(sources.map(function(u){ return cropCandidates(u); })).then(function(lists){
    var crops = [];
    // 1枚目の帯を優先し、次に2枚目…と交互に並べる
    var maxLen = 0;
    for(var a=0;a<lists.length;a++) maxLen = Math.max(maxLen, lists[a].length);
    for(var k=0;k<maxLen;k++){
      for(var a2=0;a2<lists.length;a2++){
        if(lists[a2][k]) crops.push({ url:lists[a2][k].url, tag: lists[a2][k].tag + '/' + (a2+1) + '枚目' });
      }
    }
    if(!crops.length) crops = [{ url:dataURL, tag:'全体' }];
    if(crops.length > 10) crops = crops.slice(0, 10);
    return getTessWorker().then(function(w){
      // 範囲を変えながら順に読む。全部一致したら途中で打ち切る。
      var i = 0;
      function step(){
        if(i >= crops.length) return Promise.resolve();
        var c = crops[i++];
        setKigen('', '賞味期限を読み取り中…', '読み取り範囲：' + c.tag + '（' + i + '/' + crops.length + '）');
        return recognizeWith(w, c.url, needCode ? 'code' : 'num').then(function(out){
          var t = (out && out.data ? out.data.text : '') || '';
          allText += ' ' + t;
          if(judgeDates(want, allText).okCnt === want.length) return;   // 揃ったので終了
          return step();
        }).catch(function(){ return step(); });
      }
      return step();
    });
  }).then(function(){
    var r = judgeDates(want, allText);
    renderCmp(r.results);
    var compact = String(allText).toUpperCase().replace(/[^A-Z0-9]/g, '');
    var raw = '<span style="font-size:11px">読取値: ' + esc(compact.slice(0,60)) + '</span>';

    if(r.okCnt === want.length){
      setKigen('ok', want.length > 1 ? '期限OK（両方一致）' : '期限OK',
        'ラベルの印字が製造データと一致しました。<br>' + raw);
      beep('ok');
    } else if(r.unknownCnt === want.length){
      setKigen('', '読み取れません',
        '日付を読み取れませんでした。<strong>現物と上の日付を目視で確認してください。</strong><br>' + raw);
    } else if(r.okCnt > 0){
      setKigen('', '片方だけ一致',
        '一方は一致しましたが、もう一方を読み取れませんでした。'
        + '<strong>残りを目視で確認してください。</strong><br>' + raw);
    } else {
      setKigen('ng', '期限ちがいの疑い',
        '製造データの日付を読み取れませんでした。<strong>必ず現物を確認してください。</strong><br>' + raw);
      beep('ng');
    }
  }).catch(function(e){
    renderCmp(null);
    setKigen('', 'OCRを使えません',
      '日付の自動読み取りを準備できませんでした（' + esc(String(e.message || e)) + '）。<br>'
      + '上の日付と現物を目視で確認してください。');
  });
}

/* 読み取った文字列を、期待する日付／コードと突き合わせる */
function judgeDates(want, text){
  var digits = String(text).replace(/[^0-9]/g, '');
  var results = [], okCnt = 0, unknownCnt = 0;
  for(var i=0;i<want.length;i++){
    var hit = false;
    if(isYmd(want[i].ymd)){
      var f = expectedDigitForms(want[i].ymd);
      for(var j=0;j<f.full.length;j++){
        if(digits.indexOf(f.full[j]) >= 0){ hit = true; break; }
      }
      if(!hit) hit = looseDateHit(text, want[i].ymd);
    } else {
      hit = codeHit(text, want[i].ymd);
    }
    if(hit){ results.push({ mark:'一致', color:'var(--ok)' }); okCnt++; }
    else if(digits.length < 4){ results.push({ mark:'読取不可', color:'var(--dim)' }); unknownCnt++; }
    else { results.push({ mark:'未検出', color:'var(--ng)' }); }
  }
  return { results:results, okCnt:okCnt, unknownCnt:unknownCnt };
}



/* ================= 静止画の選別 =================
   バーコードは多少ブレても読めるが、日付の文字はブレると読めない。
   読み取り後も数枚撮り、輪郭が最もはっきりした1枚をOCRに回す。 */
var sharpCv = document.createElement('canvas');

/* 輪郭の強さ（隣り合う画素の差の大きさ）でブレ具合を測る */
function sharpnessOf(video){
  try{
    var vw = video.videoWidth, vh = video.videoHeight;
    if(!vw) return 0;
    var w = 160, h = 120;
    sharpCv.width = w; sharpCv.height = h;
    var ctx = sharpCv.getContext('2d');
    // 中央付近だけを見る
    ctx.drawImage(video, vw*0.15, vh*0.15, vw*0.70, vh*0.70, 0, 0, w, h);
    var d = ctx.getImageData(0,0,w,h).data;
    var g = new Float32Array(w*h);
    for(var i=0,j=0;j<g.length;i+=4,j++){
      g[j] = (d[i]*299 + d[i+1]*587 + d[i+2]*114)/1000;
    }
    var sum = 0, n = 0;
    for(var y=1;y<h-1;y++){
      for(var x=1;x<w-1;x++){
        var k = y*w+x;
        var lap = 4*g[k] - g[k-1] - g[k+1] - g[k-w] - g[k+w];
        sum += lap*lap; n++;
      }
    }
    return n ? sum/n : 0;
  }catch(e){ return 0; }
}

/* 指定ミリ秒のあいだ撮り続け、一番くっきりした1枚を返す */
function grabBestFrame(videoId, ms, onTick){
  return new Promise(function(res){
    var v = $(videoId);
    var best = { score:-1, url:'' };
    var startAt = Date.now();
    var timer = setInterval(function(){
      var sc = sharpnessOf(v);
      if(sc > best.score){
        best.score = sc;
        best.url = grabFrame(videoId);
      }
      var left = ms - (Date.now() - startAt);
      if(onTick) onTick(Math.max(0, left));
      if(left <= 0){
        clearInterval(timer);
        res(best.url || grabFrame(videoId));
      }
    }, 120);
  });
}


/* ================= ブレを止めるためのカメラ設定 =================
   動かしながら文字を読むには、露出時間（シャッター速度）を短くするのが本筋。
   対応していない端末では黙って無視される。 */
var videoTrack = null, torchOn = false;

function tuneCameraForMotion(){
  if(!stream) return Promise.resolve('');
  var tr = stream.getVideoTracks()[0];
  if(!tr) return Promise.resolve('');
  videoTrack = tr;
  var caps = {};
  try{ caps = tr.getCapabilities ? tr.getCapabilities() : {}; }catch(e){}
  var adv = [], notes = [];

  // 露出時間を、指定できる範囲の短い側に寄せる
  if(caps.exposureMode && caps.exposureTime){
    var minT = caps.exposureTime.min, stepT = caps.exposureTime.step || 1;
    var target = minT + (caps.exposureTime.max - minT) * 0.04;
    adv.push({ exposureMode:'manual', exposureTime: Math.max(minT, Math.round(target/stepT)*stepT) });
    notes.push('露出時間を短縮');
  } else if(caps.exposureMode){
    adv.push({ exposureMode:'continuous' });
  }
  // 暗くなる分はISOで補う
  if(caps.iso){
    adv.push({ iso: Math.round(caps.iso.max * 0.7) });
    notes.push('ISO引き上げ');
  }
  // ピントは近距離に固定せず、追従させる
  if(caps.focusMode && String(caps.focusMode).indexOf('continuous') >= 0){
    adv.push({ focusMode:'continuous' });
  }
  if(!adv.length){
    DIAG.note = 'この端末では露出を調整できません';
    return Promise.resolve('');
  }
  return tr.applyConstraints({ advanced: adv }).then(function(){
    DIAG.note = notes.join(' / ') || '標準設定';
    return DIAG.note;
  }).catch(function(){
    DIAG.note = 'この端末では露出を調整できません';
    return '';
  });
}

function toggleTorch(){
  if(!videoTrack) return;
  var caps = {};
  try{ caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {}; }catch(e){}
  if(!caps.torch){
    banner('この端末ではライトを操作できません。', 'info');
    return;
  }
  torchOn = !torchOn;
  videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] }).then(function(){
    var b = $('btnTorch');
    if(b){ b.className = torchOn ? 'sm on' : 'sm'; b.textContent = torchOn ? 'ライト消灯' : 'ライト点灯'; }
  }).catch(function(){});
}

/* ================= 直近フレームの保持 =================
   読めた瞬間に止まらなくて済むよう、常に数枚を控えておく。 */
var frameRing = [], RING_MAX = 8, ringTimer = null;

function startFrameRing(videoId){
  stopFrameRing();
  frameRing = [];
  ringTimer = setInterval(function(){
    var v = $(videoId);
    if(!v || !v.videoWidth) return;
    var sc = sharpnessOf(v);
    frameRing.push({ score: sc, url: grabFrame(videoId), at: Date.now() });
    if(frameRing.length > RING_MAX) frameRing.shift();
  }, 110);
}
function stopFrameRing(){
  if(ringTimer){ clearInterval(ringTimer); ringTimer = null; }
}

/* 控えのうち、くっきりした順に数枚返す */
function bestFrames(n){
  var a = frameRing.slice().sort(function(x,y){ return y.score - x.score; });
  var out = [];
  for(var i=0;i<a.length && out.length<n;i++) out.push(a[i]);
  return out;
}

/* ================= 読み取れないときの案内 =================
   無反応のままだと「壊れているのか印字切れなのか」が分からないため、
   経過時間に応じて状態を返す。 */
var scanStartAt = 0, stateTimer = null, warnedCut = false;

function setScanState(color, text){
  var d = $('scanDot'), t = $('scanTxt');
  if(!d || !t) return;
  d.style.background = color;
  t.textContent = text;
}

function startScanWatch(){
  scanStartAt = Date.now();
  warnedCut = false;
  setScanState('var(--amber)', '読み取り中…');
  if(stateTimer) clearInterval(stateTimer);
  stateTimer = setInterval(function(){
    if(!scanning){ return; }
    var sec = (Date.now() - scanStartAt) / 1000;
    if(sec < 3){
      setScanState('var(--amber)', '読み取り中… ' + sec.toFixed(0) + '秒');
    } else if(sec < 8){
      setScanState('var(--amber)', 'まだ読み取れません（' + sec.toFixed(0) + '秒）');
      $('oneHint').textContent = 'ピントが合うように20〜30cm離し、バーコードが枠の横幅の半分以上になるようにしてください。'
        + '蛍光灯の反射があると読めません。';
    } else {
      setScanState('var(--ng)', '印字切れの疑い（' + sec.toFixed(0) + '秒読めません）');
      $('oneHint').innerHTML = '<strong>バーコードを読み取れません。</strong><br>'
        + '撮り方の問題でなければ、印字が切れている可能性があります。現物を目視で確認してください。';
      if(!warnedCut){
        warnedCut = true;
        beep('ng');
      }
    }
  }, 500);
}

function stopScanWatch(){
  if(stateTimer){ clearInterval(stateTimer); stateTimer = null; }
}

/* ================= ① ラベル確認 ================= */
function enterOne(){
  MODE = 'one';
  show('pane-select', false); show('pane-run', false); show('pane-one', true);
  $('oneTarget').innerHTML = targetHTML(TARGET);
  show('oneVerdict', false);
  show('shotCard', false);
  window.scrollTo(0,0);
  startCamera('v1').then(function(){
    scanning = true;
    tuneCameraForMotion();
    startFrameRing('v1');
    startScanWatch();
    startScan('v1', function(code){
      if(!scanning) return;
      if(!/^\d{13}$/.test(code)) return;    // 誤読は無視して読み直す
      scanning = false;
      stopScanWatch();
      setScanState('var(--ok)', '読み取りました');
      // 待たずに、控えてある直近フレームから鮮明な数枚を使う
      var picks = bestFrames(3);
      DIAG.sharp = picks.length ? picks[0].score : sharpnessOf($('v1'));
      var shots = [];
      for(var pi=0; pi<picks.length; pi++) shots.push(picks[pi].url);
      if(!shots.length) shots = [grabFrame('v1')];
      onOneRead(code, shots[0], shots);
    });
  }).catch(camError);
}

/* 読み取った瞬間のカメラ画像を静止画として残す */
function grabFrame(videoId){
  try{
    var v = $(videoId);
    if(!v || !v.videoWidth) return '';
    var cv = document.createElement('canvas');
    var maxW = 1280;
    var s = Math.min(1, maxW / v.videoWidth);
    cv.width = Math.round(v.videoWidth * s);
    cv.height = Math.round(v.videoHeight * s);
    cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', 0.9);
  }catch(e){ return ''; }
}

function showShot(dataURL){
  if(!dataURL){ show('shotCard', false); return; }
  $('shotImg').src = dataURL;
  renderCmp(null);
  show('shotCard', true);
}

function onOneRead(code, shot, shots){
  // 13桁でなければ誤読。読み取りを続ける。
  if(!/^\d{13}$/.test(code)){
    $('oneHint').innerHTML = '<strong>バーコードを正しく読み取れませんでした（' + esc(code) + '）。</strong><br>'
      + 'バーコード全体が枠に入るように、まっすぐ正面から写してください。';
    setScanState('var(--amber)', '読み直しています…');
    scanning = true;              // 止めずに読み直す
    return;
  }
  var img = (shot !== undefined ? shot : grabFrame('v1'));
  showShot(img);
  show('kigenVerdict', false);
  var last5 = code.slice(-5);
  var okJan = TARGET.jan5 && last5 === TARGET.jan5;
  var cd = janValid(code);
  var v = $('oneVerdict');
  show('oneVerdict', true);
  if(okJan && cd){
    v.className = 'verdict ok';
    $('oneBig').textContent = '商品OK';
    $('oneMsg').innerHTML = '読み取り：' + code + '（下5桁 ' + last5 + '）';
    beep('ok'); flash('f1','ok');
    if(img) runDateOcr(img, shots);   // 続けて賞味期限を読む（複数枚を使う）
  } else {
    v.className = 'verdict ng';
    $('oneBig').textContent = okJan ? '要確認' : '商品ちがい';
    $('oneMsg').innerHTML = '読み取り：' + code + '（下5桁 ' + last5 + '）<br>'
      + (okJan ? 'チェックデジットが合いません。読み取り不良か、正規のJANでない可能性があります。'
               : '指定した商品のJAN下5桁「' + TARGET.jan5 + '」と一致しません。ラベルを確認してください。');
    beep('ng'); flash('f1','ng');
    show('kigenVerdict', false);
  }
}

/* ================= ② 流しで確認 ================= */
function enterRun(){
  MODE = 'run';
  show('pane-select', false); show('pane-one', false); show('pane-run', true);
  $('runTarget').innerHTML = targetHTML(TARGET);
  okCount = 0; ngCount = 0; setCount = null; logRows = [];
  lastCode = ''; lastHitAt = 0; presentSince = 0; warnedAt = 0;
  renderCounts(); renderLog(); renderSens();
  show('runVerdict', false);
  window.scrollTo(0,0);
  startCamera('v2').then(function(){
    scanning = true;
    tuneCameraForMotion();
    startScan('v2', onRunHit, onRunMiss);
  }).catch(camError);
}

function onRunHit(code){
  if(!/^\d{13}$/.test(code)) return;   // 誤読は無視する
  var t = Date.now();
  presentSince = 0;                       // 読めたので「読めない状態」をリセット
  if(code === lastCode && t - lastHitAt < GAP_MS){
    lastHitAt = t;
    return;                               // 同一個体を連続で数えない
  }
  lastCode = code; lastHitAt = t;

  var last5 = code.slice(-5);
  var okJan = TARGET.jan5 && last5 === TARGET.jan5 && janValid(code);
  if(okJan){
    okCount++;
    pushLog('OK', last5, 'ok');
    beep('ok'); flash('f2','ok');
    setVerdict('ok', 'OK ' + okCount, '下5桁 ' + last5);
  } else {
    ngCount++;
    pushLog('商品ちがい ' + last5, last5, 'ng');
    beep('ng'); flash('f2','ng');
    setVerdict('ng', '商品ちがい', '読み取り ' + code + ' / 指定 ' + TARGET.jan5 + '。手を止めて現品を確認してください。');
  }
  renderCounts();
}

function onRunMiss(){
  var t = Date.now();
  if(t - lastHitAt < 350) return;                   // 直後は無視
  if(!labelPresent($('v2'))){ presentSince = 0; return; }
  if(!presentSince){ presentSince = t; return; }
  if(t - presentSince < missWindow) return;
  if(t - warnedAt < 1500) return;                   // 鳴り続けを防ぐ
  warnedAt = t;
  presentSince = 0;
  ngCount++;
  pushLog('読めません（印字切れの疑い）', '', 'ng');
  beep('ng'); flash('f2','ng');
  setVerdict('ng', '読めません', 'ラベルは見えていますがバーコードを読み取れません。印字切れの疑いがあります。手を止めて現品を確認してください。');
  renderCounts();
}

function setVerdict(kind, big, msg){
  var v = $('runVerdict');
  v.className = 'verdict ' + kind;
  $('runBig').textContent = big;
  $('runMsg').textContent = msg;
  show('runVerdict', true);
}
function pushLog(text, code, kind){
  logRows.unshift({ t: nowHM(), text: text, kind: kind });
  if(logRows.length > 200) logRows.pop();
  renderLog();
}
function renderLog(){
  var h = '';
  for(var i=0;i<logRows.length;i++){
    h += '<div><span class="t">' + logRows[i].t + '</span>'
       + '<span class="r ' + logRows[i].kind + '">' + esc(logRows[i].text) + '</span></div>';
  }
  $('runLog').innerHTML = h || '<div class="note">まだ読み取りがありません。</div>';
}
function renderCounts(){
  $('cOk').textContent = okCount;
  $('cNg').textContent = ngCount;
  $('cSet').textContent = setCount === null ? '—' : setCount;
}
function renderSens(){
  $('sensNote').textContent =
    '「読めない」と判断するまでの時間：' + (missWindow/1000).toFixed(1) + '秒。'
    + 'スライドが速くて誤って鳴るときは「ゆるく」、印字切れを見逃すときは「厳しく」してください。';
}

function undo(){
  if(!logRows.length) return;
  var r = logRows.shift();
  if(r.kind === 'ok' && okCount > 0) okCount--;
  if(r.kind === 'ng' && ngCount > 0) ngCount--;
  lastCode = '';
  renderCounts(); renderLog();
  beep('tick');
}

function finish(){
  var msg = 'OK ' + okCount + '個 / 要確認 ' + ngCount + '個';
  if(setCount !== null){
    var diff = setCount - okCount - ngCount;
    if(diff > 0){
      setVerdict('ng', '数が足りません',
        msg + '。並べた数 ' + setCount + ' に対して ' + diff + '個が読み取られていません。'
        + 'かざし漏れか、読めなかった個体があります。もう一度流してください。');
      beep('ng');
      return;
    }
    if(diff < 0){
      setVerdict('ng', '数が多い',
        msg + '。並べた数 ' + setCount + ' より ' + (-diff) + '個多く読み取っています。二重カウントの可能性があります。');
      beep('ng');
      return;
    }
  }
  if(ngCount > 0){
    setVerdict('ng', '要確認 ' + ngCount + '個', msg + '。履歴を見て該当個体を確認してください。');
    beep('ng');
  } else {
    setVerdict('ok', '全数OK', msg + (setCount !== null ? '（並べた数 ' + setCount + ' と一致）' : ''));
    beep('ok');
  }
}

function camError(e){
  var m = String(e && e.name || e);
  var msg = 'カメラを起動できませんでした。';
  if(m.indexOf('NotAllowed') >= 0) msg += 'カメラの使用を許可してください（設定→Safari→カメラ）。';
  else if(location.protocol !== 'https:' && location.hostname !== 'localhost') msg += 'HTTPS でないとカメラは使えません。';
  else msg += m;
  banner(msg);
  backToSelect();
}

function backToSelect(){
  stopCamera();
  MODE = null;
  show('pane-one', false); show('pane-run', false); show('pane-select', true);
  window.scrollTo(0,0);
}

    + '）と印字が一致していません。ラベルの設定を確認してください。';
  beep('ng');
});
$('btnPhoto').addEventListener('click', function(){ $('photoFile').click(); });
$('photoFile').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!f) return;
  readFromPhoto(f);
});

/* 写真ファイルからバーコードを読む（画面越し撮影より確実） */
function readFromPhoto(file){
  var url = URL.createObjectURL(file);
  $('photoPrev').src = url;
  $('photoPrev').classList.remove('hidden');
  $('oneHint').textContent = '写真を解析中…';

  var img = new Image();
  img.onload = function(){
    if(ENGINE === 'native'){
      var det = new BarcodeDetector({ formats: ['ean_13'] });
      det.detect(img).then(function(codes){
        if(codes && codes.length){
          $('oneHint').textContent = '写真から読み取りました。';
          var c = document.createElement('canvas');
          c.width = img.naturalWidth; c.height = img.naturalHeight;
          c.getContext('2d').drawImage(img, 0, 0);
          onOneRead(codes[0].rawValue, c.toDataURL('image/jpeg', .9));
        } else {
          $('oneHint').textContent = 'この写真からバーコードを検出できませんでした。';
          beep('ng');
        }
        URL.revokeObjectURL(url);
      }).catch(function(){
        $('oneHint').textContent = 'この写真からバーコードを検出できませんでした。';
        URL.revokeObjectURL(url);
      });
      return;
    }
    if(!window.ZXing){
      $('oneHint').textContent = '読み取り機能が読み込めていません。通信環境を確認して開き直してください。';
      return;
    }
    // 等倍・1.5倍・0.6倍で試す（写りの大小に対応）
    var scales = [1, 1.5, 0.6];
    for(var i=0;i<scales.length;i++){
      var cv = document.createElement('canvas');
      cv.width = Math.round(img.naturalWidth * scales[i]);
      cv.height = Math.round(img.naturalHeight * scales[i]);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      var txt = decodeCanvasSync(cv);
      if(txt){
        URL.revokeObjectURL(url);
        $('oneHint').textContent = '写真から読み取りました。';
        onOneRead(txt, cv.toDataURL('image/jpeg', 0.9));
        return;
      }
    }
    URL.revokeObjectURL(url);
    $('oneHint').textContent = 'この写真からバーコードを検出できませんでした。'
      + 'バーコードが大きく、ピントが合って写っているものを選んでください。';
    show('oneVerdict', false);
    beep('ng');
  };
  img.onerror = function(){
    URL.revokeObjectURL(url);
    $('oneHint').textContent = '画像を読み込めませんでした。';
  };
  img.src = url;
}
$('btnRunBack').addEventListener('click', backToSelect);
$('btnOneRetry').addEventListener('click', function(){
  show('oneVerdict', false);
  show('shotCard', false);
  show('kigenVerdict', false);
  $('oneHint').textContent = 'バーコードを枠の中に入れてください。読み取ると自動で照合します。';
  scanning = true;
  startScanWatch();
});
$('btnUndo').addEventListener('click', undo);
$('btnFinish').addEventListener('click', finish);
$('btnSetCount').addEventListener('click', function(){
  var s = window.prompt('バットに並べた数を入力してください', setCount === null ? '' : String(setCount));
  if(s === null) return;
  var n = parseInt(s, 10);
  setCount = isFinite(n) && n > 0 ? n : null;
  renderCounts();
});
$('btnSensUp').addEventListener('click', function(){
  missWindow = Math.max(600, missWindow - 200); renderSens();
});
$('btnSensDown').addEventListener('click', function(){
  missWindow = Math.min(3000, missWindow + 200); renderSens();
});
document.addEventListener('visibilitychange', function(){
  if(document.hidden && MODE) stopCamera();
});

/* ================= 起動 ================= */
(function init(){
  $('btnMode1').disabled = true;
  $('btnMode2').disabled = true;
  prepareEngine().then(function(){
    pickItem();   // 商品が選べていればボタンを有効化
  }).catch(function(){
    setEngineMsg('読み取り機能を読み込めませんでした。社内ネットワークで外部サイトが遮断されている可能性があります。'
      + '通信環境を変えて開き直してください。', 'err');
  });
  loadData();
})();
